<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MiniChat</title>
<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface-hover: #f5f5f5;
    --border: #e4e6eb;
    --text: #050505;
    --text-secondary: #65676b;
    --text-tertiary: #8a8d91;
    --accent: #0084ff;
    --accent-light: #e7f3ff;
    --danger: #ff3b30;
    --success: #34c759;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-full: 999px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    display: flex; justify-content: center; align-items: center;
    min-height: 100dvh; padding: 0;
    color: var(--text);
  }
  .app {
    width: 100%; max-width: 1000px; height: 100dvh;
    background: var(--surface);
    display: flex; flex-direction: column; overflow: hidden;
    position: relative;
  }
  @media (min-width: 769px) {
    .app { height: 700px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
  }
  .header {
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; z-index: 10;
  }
  .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
  .header-user { font-size: 14px; color: var(--text-secondary); display: flex; align-items: center; gap: 10px; }
  .btn {
    padding: 8px 16px; border-radius: var(--radius-md); border: none;
    background: var(--surface-hover); color: var(--text); font-size: 14px;
    font-weight: 500; cursor: pointer; transition: all .2s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    flex-shrink: 0;
  }
  .btn:hover { background: var(--border); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #0073e6; }
  .btn-icon { padding: 8px; width: 38px; height: 38px; border-radius: var(--radius-full); }
  .btn-danger { background: #ffebee; color: var(--danger); }
  .btn-danger:hover { background: #ffcdd2; }
  .btn-success { background: #e8f5e9; color: #2e7d32; }
  .btn-success:hover { background: #c8e6c9; }
  .btn-ghost { background: transparent; }
  .btn-ghost:hover { background: var(--surface-hover); }
  .screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
  .form-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
  .form-box { width: 100%; max-width: 380px; animation: slideUp .5s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  .form-title { font-size: 28px; font-weight: 700; margin-bottom: 28px; text-align: center; letter-spacing: -0.5px; }
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .input-wrap { position: relative; display: flex; align-items: center; }
  .input-wrap input, .input-wrap textarea {
    width: 100%; padding: 14px 16px; padding-right: 48px;
    border-radius: var(--radius-md); border: 1.5px solid var(--border);
    font-size: 16px; outline: none; transition: all .2s; background: var(--surface);
    font-family: inherit; color: var(--text);
  }
  .input-wrap input:focus, .input-wrap textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .toggle-pass {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 20px;
    opacity: 0.5; transition: opacity .2s; padding: 4px;
  }
  .toggle-pass:hover { opacity: 1; }
  .form-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .form-actions .btn { justify-content: center; padding: 14px; font-size: 16px; font-weight: 600; }
  .form-toggle { text-align: center; font-size: 15px; color: var(--text-secondary); margin-top: 20px; }
  .form-toggle a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 600; }
  .form-toggle a:hover { text-decoration: underline; }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 6px; min-height: 20px; font-weight: 500; }
  .two-col { display: flex; flex: 1; overflow: hidden; position: relative; }
  .sidebar {
    width: 320px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; background: var(--surface);
    flex-shrink: 0;
  }
  .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .sidebar-title { font-size: 16px; font-weight: 700; }
  .sidebar-tabs { display: flex; padding: 4px 12px; gap: 4px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    flex: 1; padding: 8px; border: none; background: transparent;
    font-size: 13px; font-weight: 600; color: var(--text-tertiary); cursor: pointer;
    border-radius: var(--radius-md); transition: all .2s; position: relative;
  }
  .tab-btn:hover { background: var(--surface-hover); color: var(--text-secondary); }
  .tab-btn.active { background: var(--accent-light); color: var(--accent); }
  .tab-btn .badge {
    position: absolute; top: 2px; right: 2px;
    background: var(--danger); color: #fff; font-size: 10px;
    padding: 1px 5px; border-radius: var(--radius-full); font-weight: 700;
    min-width: 16px; text-align: center;
  }
  .add-contact-form { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .add-contact-form input {
    flex: 1; padding: 10px 14px; border-radius: var(--radius-md);
    border: 1.5px solid var(--border); font-size: 14px; outline: none; transition: all .2s;
  }
  .add-contact-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .hint { font-size: 12px; color: var(--text-tertiary); padding: 8px 14px; }
  .contact-list { flex: 1; overflow-y: auto; padding: 6px; }
  .contact-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: var(--radius-md); cursor: pointer;
    transition: all .2s ease; position: relative; margin-bottom: 2px;
  }
  .contact-item:hover { background: var(--surface-hover); transform: translateX(2px); }
  .contact-item.active { background: var(--accent-light); }
  .contact-avatar {
    width: 48px; height: 48px; border-radius: var(--radius-full);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff; flex-shrink: 0;
    position: relative; box-shadow: var(--shadow-sm);
  }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-preview { font-size: 13px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .contact-time { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }
  .contact-unread {
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: var(--radius-full); flex-shrink: 0;
    display: none;
  }
  .contact-unread.show { display: block; }
  .contact-actions {
    opacity: 0; transition: opacity .2s; display: flex; gap: 4px;
  }
  .contact-item:hover .contact-actions { opacity: 1; }
  .main-chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: var(--bg); }
  .chat-header {
    padding: 10px 18px; background: var(--surface);
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
    flex-shrink: 0; box-shadow: var(--shadow-sm);
  }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .msg-wrapper { display: flex; flex-direction: column; gap: 2px; animation: messageIn .3s ease; }
  @keyframes messageIn { from { opacity: 0; transform: translateY(12px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .msg-sender { font-size: 12px; font-weight: 600; color: var(--accent); padding-left: 14px; }
  .msg {
    max-width: 75%; padding: 10px 14px; border-radius: var(--radius-lg);
    font-size: 15px; line-height: 1.45; position: relative; word-break: break-word;
    box-shadow: var(--shadow-sm);
  }
  .msg-own { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg-other { align-self: flex-start; background: var(--surface); color: var(--text); border-bottom-left-radius: 4px; }
  .msg-time { font-size: 11px; opacity: .65; margin-top: 4px; text-align: right; }
  .msg-video {
    width: 220px; height: 220px; border-radius: 50%;
    object-fit: cover; display: block; background: #000; cursor: pointer;
  }
  .chat-input-area {
    padding: 12px 16px; background: var(--surface);
    border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end;
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1; padding: 12px 18px; border-radius: var(--radius-full);
    border: 1.5px solid var(--border); font-size: 15px; outline: none;
    resize: none; max-height: 120px; font-family: inherit; line-height: 1.4;
    min-height: 44px; background: var(--bg); transition: all .2s;
  }
  .chat-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); background: var(--surface); }
  .welcome-hint { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--text-tertiary); font-size: 16px; text-align: center; padding: 40px; }
  .loader { display: inline-block; width: 20px; height: 20px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: #fff; padding: 12px 24px; border-radius: var(--radius-md);
    font-size: 14px; font-weight: 500; opacity: 0; transition: all .3s ease;
    pointer-events: none; z-index: 100; box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: none; align-items: center; justify-content: center;
    z-index: 200; padding: 16px; backdrop-filter: blur(4px);
    opacity: 0; transition: opacity .3s;
  }
  .modal-overlay.show { display: flex; opacity: 1; }
  .modal-box {
    background: var(--surface); border-radius: var(--radius-lg); padding: 28px;
    width: 100%; max-width: 400px; box-shadow: var(--shadow-lg);
    transform: scale(0.9); transition: transform .3s ease;
  }
  .modal-overlay.show .modal-box { transform: scale(1); }
  .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .modal-actions .btn { flex: 1; justify-content: center; padding: 12px; }
  .mobile-back { display: none !important; }
  @media (max-width: 768px) {
    .sidebar { width: 100%; position: absolute; top: 0; left: 0; height: 100%; z-index: 1; }
    .main-chat { width: 100%; position: absolute; top: 0; left: 0; height: 100%; z-index: 2; background: var(--bg); display: none !important; }
    .app.chat-open .sidebar { display: none !important; }
    .app.chat-open .main-chat { display: flex !important; }
    .mobile-back { display: inline-flex !important; }
    .chat-input { font-size: 16px; }
    .input-wrap input { font-size: 16px; }
    .contact-actions { opacity: 1; }
    .sidebar { width: 100%; }
    .msg { max-width: 85%; }
  }
</style>
<base target="_blank">
</head>
<body>

<div class="app" id="app-root">
  <div class="screen active" id="screen-auth">
    <div class="header">
      <div class="header-title">💬 MiniChat</div>
    </div>
    <div class="form-container">
      <div class="form-box">
        <div class="form-title" id="auth-title">Вход</div>
        <div id="login-form">
          <div class="input-group">
            <label>Email</label>
            <div class="input-wrap">
              <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
            </div>
          </div>
          <div class="input-group">
            <label>Пароль</label>
            <div class="input-wrap">
              <input type="password" id="login-password" placeholder="••••••">
              <button type="button" class="toggle-pass" onclick="togglePassword('login-password')">👁</button>
            </div>
          </div>
          <div class="error-msg" id="login-error"></div>
          <div class="form-actions">
            <button class="btn btn-primary" onclick="doLogin()">Войти</button>
          </div>
          <div class="form-toggle">Нет аккаунта? <a onclick="showRegister()">Создать</a></div>
        </div>
        <div id="register-form" style="display:none">
          <div class="input-group">
            <label>Имя (ник)</label>
            <div class="input-wrap">
              <input type="text" id="reg-name" placeholder="your_nickname" autocomplete="off">
            </div>
          </div>
          <div class="input-group">
            <label>Email</label>
            <div class="input-wrap">
              <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
            </div>
          </div>
          <div class="input-group">
            <label>Пароль</label>
            <div class="input-wrap">
              <input type="password" id="reg-password" placeholder="минимум 6 символов">
              <button type="button" class="toggle-pass" onclick="togglePassword('reg-password')">👁</button>
            </div>
          </div>
          <div class="error-msg" id="reg-error"></div>
          <div class="form-actions">
            <button class="btn btn-primary" onclick="doRegister()">Создать аккаунт</button>
          </div>
          <div class="form-toggle">Уже есть аккаунт? <a onclick="showLogin()">Войти</a></div>
        </div>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-main">
    <div class="header">
      <div class="header-title">💬 MiniChat</div>
      <div class="header-user">
        <span id="current-user-name"></span>
        <button class="btn btn-icon" onclick="logout()" title="Выйти">🚪</button>
      </div>
    </div>
    <div class="two-col">
      <div class="sidebar">
        <div class="sidebar-tabs">
          <button class="tab-btn active" id="tab-friends" onclick="switchTab('friends')">Друзья</button>
          <button class="tab-btn" id="tab-channels" onclick="switchTab('channels')">Каналы</button>
          <button class="tab-btn" id="tab-requests" onclick="switchTab('requests')">Заявки <span id="req-badge" class="badge" style="display:none">0</span></button>
        </div>
        <div id="panel-friends">
          <div class="add-contact-form">
            <input type="text" id="add-contact-input" placeholder="Ник друга..." onkeydown="if(event.key==='Enter')sendFriendRequest()">
            <button class="btn btn-icon" onclick="sendFriendRequest()" title="Добавить">➕</button>
          </div>
          <div class="contact-list" id="contact-list"></div>
        </div>
        <div id="panel-channels" style="display:none">
          <div class="add-contact-form">
            <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="openModal('create-channel-modal')">➕ Создать канал</button>
          </div>
          <div class="contact-list" id="channel-list"></div>
        </div>
        <div id="panel-requests" style="display:none">
          <div class="hint" style="padding:12px 16px">Входящие заявки в друзья</div>
          <div class="contact-list" id="request-list"></div>
        </div>
      </div>
      <div class="main-chat" id="chat-panel">
        <div class="welcome-hint" id="no-chat">
          <div style="font-size:56px;opacity:.15">💬</div>
          <div>Выбери друга или канал, чтобы начать общение</div>
        </div>
        <div id="active-chat" style="display:none;flex-direction:column;flex:1;overflow:hidden">
          <div class="chat-header">
            <button class="btn btn-icon mobile-back" onclick="closeChat()" title="Назад">←</button>
            <div class="contact-avatar" id="chat-avatar"></div>
            <div style="min-width:0;flex:1">
              <div class="contact-name" id="chat-name" style="font-size:16px"></div>
              <div class="contact-preview" id="chat-status" style="margin-top:0"></div>
            </div>
            <button class="btn btn-icon" id="chat-menu-btn" onclick="toggleChatMenu()" title="Меню">⋮</button>
          </div>
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-area">
            <input type="file" id="video-input" accept="video/*" style="display:none" onchange="uploadVideo()">
            <button class="btn btn-icon" onclick="document.getElementById('video-input').click()" title="Кружок">📹</button>
            <textarea class="chat-input" id="msg-input" rows="1" placeholder="Напиши сообщение..." onkeydown="handleKey(event)"></textarea>
            <button class="btn btn-primary" style="border-radius:50%;width:44px;height:44px;padding:0" onclick="sendMessage()">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="create-channel-modal">
  <div class="modal-box">
    <div class="modal-title">Создать канал</div>
    <div class="input-group">
      <label>Название</label>
      <div class="input-wrap">
        <input type="text" id="new-channel-name" placeholder="Мой канал" onkeydown="if(event.key==='Enter')createChannel()">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('create-channel-modal')">Отмена</button>
      <button class="btn btn-primary" onclick="createChannel()">Создать</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="add-member-modal">
  <div class="modal-box">
    <div class="modal-title">Добавить в канал</div>
    <div class="input-group">
      <label>Ник друга</label>
      <div class="input-wrap">
        <input type="text" id="new-member-name" placeholder="nickname" onkeydown="if(event.key==='Enter')addMemberToChannel()">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('add-member-modal')">Отмена</button>
      <button class="btn btn-primary" onclick="addMemberToChannel()">Добавить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, set, push, onValue, get, remove, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB5aZcc6RtCZtIA4BHyUh6DA2HQ1n2gu-E",
    authDomain: "minichat-32a89.firebaseapp.com",
    databaseURL: "https://minichat-32a89-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "minichat-32a89",
    storageBucket: "minichat-32a89.firebasestorage.app",
    messagingSenderId: "273882434443",
    appId: "1:273882434443:web:cee3f9bdb215df7b54fd8e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let currentUser = null;
  let currentContact = null;
  let currentChannel = null;
  let unsubMessages = null;
  let activeTab = 'friends';
  const avatarColors = ['#0084ff','#ff3b30','#34c759','#ff9500','#af52de','#5856d6','#ff2d55','#5ac8fa'];

  function getAvatarColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return avatarColors[Math.abs(hash) % avatarColors.length];
  }

  window.showLogin = () => {
    document.getElementById('login-form').style.display = 'block';
    document.getElementById('register-form').style.display = 'none';
    document.getElementById('auth-title').textContent = 'Вход';
    document.getElementById('login-error').textContent = '';
  };
  window.showRegister = () => {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('register-form').style.display = 'block';
    document.getElementById('auth-title').textContent = 'Регистрация';
    document.getElementById('reg-error').textContent = '';
  };
  window.togglePassword = (id) => {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  };
  window.openModal = (id) => document.getElementById(id).classList.add('show');
  window.closeModal = (id) => document.getElementById(id).classList.remove('show');

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  window.doRegister = async () => {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-password').value;
    const errEl = document.getElementById('reg-error');
    if (!name || !email || !pass) { errEl.textContent = 'Заполни все поля'; return; }
    if (pass.length < 6) { errEl.textContent = 'Пароль минимум 6 символов'; return; }
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      await set(ref(db, 'uids/' + cred.user.uid), name);
      await set(ref(db, 'users/' + name), { uid: cred.user.uid, email, created: Date.now() });
      errEl.textContent = '';
      toast('Аккаунт создан!');
      window.showLogin();
      document.getElementById('login-error').textContent = 'Теперь войди.';
    } catch (e) {
      errEl.textContent = e.message.includes('email-already') ? 'Этот email уже используется' : e.message;
    }
  };

  window.doLogin = async () => {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      errEl.textContent = '';
    } catch (e) {
      errEl.textContent = 'Неверный email или пароль';
    }
  };

  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const uidSnap = await get(ref(db, 'uids/' + user.uid));
      currentUser = uidSnap.exists() ? uidSnap.val() : (user.displayName || user.email.split('@')[0]);
      document.getElementById('screen-auth').classList.remove('active');
      document.getElementById('screen-main').classList.add('active');
      document.getElementById('current-user-name').textContent = currentUser;
      listenRequests();
      renderFriends();
      renderChannels();
    } else {
      currentUser = null; currentContact = null; currentChannel = null;
      if (unsubMessages) { unsubMessages(); unsubMessages = null; }
      document.getElementById('screen-auth').classList.add('active');
      document.getElementById('screen-main').classList.remove('active');
      document.getElementById('no-chat').style.display = 'flex';
      document.getElementById('active-chat').style.display = 'none';
      document.getElementById('app-root').classList.remove('chat-open');
    }
  });

  window.switchTab = (tab) => {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('panel-friends').style.display = tab === 'friends' ? 'block' : 'none';
    document.getElementById('panel-channels').style.display = tab === 'channels' ? 'block' : 'none';
    document.getElementById('panel-requests').style.display = tab === 'requests' ? 'block' : 'none';
    if (tab === 'friends') renderFriends();
    if (tab === 'channels') renderChannels();
    if (tab === 'requests') renderRequests();
  };

  window.sendFriendRequest = async () => {
    const input = document.getElementById('add-contact-input');
    const to = input.value.trim();
    if (!to) return;
    if (to === currentUser) { toast('Это ты :)'); input.value = ''; return; }
    const uSnap = await get(ref(db, 'users/' + to));
    if (!uSnap.exists()) { toast('Пользователь "' + to + '" не найден'); return; }
    const cSnap = await get(ref(db, 'contacts/' + currentUser + '/' + to));
    if (cSnap.exists()) { toast('Уже в друзьях'); input.value = ''; return; }
    const rSnap = await get(ref(db, 'friendRequests/' + to + '/' + currentUser));
    if (rSnap.exists()) { toast('Заявка уже отправлена'); input.value = ''; return; }
    await set(ref(db, 'friendRequests/' + to + '/' + currentUser), { from: currentUser, ts: Date.now() });
    input.value = '';
    toast('Заявка отправлена!');
  };

  function listenRequests() {
    onValue(ref(db, 'friendRequests/' + currentUser), (snap) => {
      const count = snap.exists() ? Object.keys(snap.val()).length : 0;
      const badge = document.getElementById('req-badge');
      badge.textContent = count;
      badge.style.display = count > 0 ? 'inline-block' : 'none';
      if (activeTab === 'requests') renderRequests();
    });
  }

  async function renderRequests() {
    const list = document.getElementById('request-list');
    const snap = await get(ref(db, 'friendRequests/' + currentUser));
    if (!snap.exists()) { list.innerHTML = '<div class="hint" style="text-align:center;padding-top:40px;color:var(--text-tertiary)">Нет входящих заявок</div>'; return; }
    list.innerHTML = '';
    Object.entries(snap.val()).forEach(([from, data]) => {
      const div = document.createElement('div');
      div.className = 'contact-item';
      div.style.animation = 'slideUp .3s ease';
      div.innerHTML = `
        <div class="contact-avatar" style="background:${getAvatarColor(from)}">${from[0].toUpperCase()}</div>
        <div class="contact-info"><div class="contact-name">${escapeHtml(from)}</div><div class="contact-preview">Хочет добавить тебя в друзья</div></div>
        <div class="contact-actions">
          <button class="btn btn-success btn-icon" onclick="acceptRequest('${from}')">✓</button>
          <button class="btn btn-danger btn-icon" onclick="rejectRequest('${from}')">✕</button>
        </div>`;
      list.appendChild(div);
    });
  }

  window.acceptRequest = async (from) => {
    await set(ref(db, 'contacts/' + currentUser + '/' + from), true);
    await set(ref(db, 'contacts/' + from + '/' + currentUser), true);
    await remove(ref(db, 'friendRequests/' + currentUser + '/' + from));
    toast(from + ' добавлен в друзья');
    renderRequests(); renderFriends();
  };

  window.rejectRequest = async (from) => {
    await remove(ref(db, 'friendRequests/' + currentUser + '/' + from));
    toast('Заявка отклонена');
    renderRequests();
  };

  async function renderFriends() {
    const list = document.getElementById('contact-list');
    list.innerHTML = '<div class="hint" style="text-align:center;padding:30px"><span class="loader"></span></div>';
    const snap = await get(ref(db, 'contacts/' + currentUser));
    const contacts = snap.exists() ? snap.val() : {};
    const names = Object.keys(contacts);
    if (names.length === 0) {
      list.innerHTML = '<div class="hint" style="text-align:center;padding-top:40px;color:var(--text-tertiary)">Пока нет друзей.<br>Отправь заявку!</div>';
      return;
    }
    const items = [];
    for (const name of names) {
      const ck = chatKey(currentUser, name);
      const [metaSnap, readSnap, msgSnap] = await Promise.all([
        get(ref(db, 'chatMeta/' + ck + '/lastActivity')),
        get(ref(db, 'lastRead/' + currentUser + '/' + ck)),
        get(query(ref(db, 'messages/' + ck), limitToLast(20)))
      ]);
      const lastActivity = metaSnap.exists() ? metaSnap.val() : null;
      const lastRead = readSnap.exists() ? readSnap.val() : 0;
      let unreadCount = 0;
      if (msgSnap.exists()) {
        Object.values(msgSnap.val()).forEach(m => {
          if (m.from !== currentUser && m.ts > lastRead) unreadCount++;
        });
      }
      items.push({ name, lastActivity, unreadCount });
    }
    items.sort((a, b) => {
      const ta = a.lastActivity ? a.lastActivity.ts : 0;
      const tb = b.lastActivity ? b.lastActivity.ts : 0;
      return tb - ta;
    });
    list.innerHTML = '';
    for (const item of items) {
      const div = document.createElement('div');
      div.className = 'contact-item' + (currentContact === item.name && !currentChannel ? ' active' : '');
      div.onclick = () => openChat(item.name);
      const lastText = item.lastActivity
        ? (item.lastActivity.videoUrl ? '📹 Кружок' : escapeHtml(item.lastActivity.text || '').substring(0, 32))
        : 'Нет сообщений';
      const timeStr = item.lastActivity ? formatTime(item.lastActivity.ts) : '';
      div.innerHTML = `
        <div class="contact-avatar" style="background:${getAvatarColor(item.name)}">${item.name[0].toUpperCase()}</div>
        <div class="contact-info">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="contact-name">${escapeHtml(item.name)}</div>
          </div>
          <div class="contact-preview">${lastText}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
          <div class="contact-time">${timeStr}</div>
          <div class="contact-unread ${item.unreadCount > 0 ? 'show' : ''}">${item.unreadCount}</div>
        </div>
        <div class="contact-actions" style="position:absolute;right:8px;top:50%;transform:translateY(-50%)">
          <button class="btn btn-danger btn-icon" style="width:32px;height:32px;font-size:12px" onclick="event.stopPropagation();removeFriend('${item.name}')">🗑</button>
        </div>`;
      list.appendChild(div);
    }
  }

  window.removeFriend = async (name) => {
    if (!confirm('Удалить ' + name + ' из друзей?')) return;
    await remove(ref(db, 'contacts/' + currentUser + '/' + name));
    await remove(ref(db, 'contacts/' + name + '/' + currentUser));
    if (currentContact === name) closeChat();
    toast(name + ' удалён из друзей');
    renderFriends();
  };

  function chatKey(a, b) { return [a, b].sort().join('__'); }
  function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    if (isToday) return d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    return d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
  }

  window.createChannel = async () => {
    const name = document.getElementById('new-channel-name').value.trim();
    if (!name) return;
    const chRef = push(ref(db, 'channels'));
    await set(chRef, { name, createdBy: currentUser, created: Date.now() });
    await set(ref(db, 'channelMembers/' + chRef.key + '/' + currentUser), { role: 'admin', joined: Date.now() });
    await set(ref(db, 'userChannels/' + currentUser + '/' + chRef.key), true);
    document.getElementById('new-channel-name').value = '';
    closeModal('create-channel-modal');
    toast('Канал создан!');
    renderChannels();
  };

  async function renderChannels() {
    const list = document.getElementById('channel-list');
    list.innerHTML = '<div class="hint" style="text-align:center;padding:30px"><span class="loader"></span></div>';
    const snap = await get(ref(db, 'userChannels/' + currentUser));
    if (!snap.exists()) { list.innerHTML = '<div class="hint" style="text-align:center;padding-top:40px;color:var(--text-tertiary)">Нет каналов.<br>Создай первый!</div>'; return; }
    list.innerHTML = '';
    const ids = Object.keys(snap.val());
    const items = [];
    for (const id of ids) {
      const [chSnap, metaSnap, readSnap, msgSnap] = await Promise.all([
        get(ref(db, 'channels/' + id)),
        get(ref(db, 'channelMeta/' + id + '/lastActivity')),
        get(ref(db, 'lastRead/' + currentUser + '/channel_' + id)),
        get(query(ref(db, 'channelMessages/' + id), limitToLast(20)))
      ]);
      if (!chSnap.exists()) continue;
      const ch = chSnap.val();
      const lastActivity = metaSnap.exists() ? metaSnap.val() : null;
      const lastRead = readSnap.exists() ? readSnap.val() : 0;
      let unreadCount = 0;
      if (msgSnap.exists()) {
        Object.values(msgSnap.val()).forEach(m => {
          if (m.from !== currentUser && m.ts > lastRead) unreadCount++;
        });
      }
      items.push({ id, name: ch.name, lastActivity, unreadCount });
    }
    items.sort((a, b) => {
      const ta = a.lastActivity ? a.lastActivity.ts : 0;
      const tb = b.lastActivity ? b.lastActivity.ts : 0;
      return tb - ta;
    });
    for (const item of items) {
      const div = document.createElement('div');
      div.className = 'contact-item' + (currentChannel === item.id ? ' active' : '');
      div.onclick = () => openChannel(item.id);
      const lastText = item.lastActivity
        ? (item.lastActivity.videoUrl ? '📹 Кружок' : escapeHtml(item.lastActivity.text || '').substring(0, 32))
        : 'Нет сообщений';
      const timeStr = item.lastActivity ? formatTime(item.lastActivity.ts) : '';
      div.innerHTML = `
        <div class="contact-avatar" style="background:linear-gradient(135deg,#667eea,#764ba2)">#</div>
        <div class="contact-info">
          <div class="contact-name">${escapeHtml(item.name)}</div>
          <div class="contact-preview">${lastText}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
          <div class="contact-time">${timeStr}</div>
          <div class="contact-unread ${item.unreadCount > 0 ? 'show' : ''}">${item.unreadCount}</div>
        </div>`;
      list.appendChild(div);
    }
  }

  window.openChannel = async (id) => {
    currentChannel = id; currentContact = null;
    const chSnap = await get(ref(db, 'channels/' + id));
    const ch = chSnap.val() || {};
    document.getElementById('no-chat').style.display = 'none';
    document.getElementById('active-chat').style.display = 'flex';
    document.getElementById('chat-name').textContent = ch.name || 'Канал';
    document.getElementById('chat-avatar').textContent = '#';
    document.getElementById('chat-avatar').style.background = 'linear-gradient(135deg,#667eea,#764ba2)';
    document.getElementById('chat-status').textContent = 'канал';
    document.getElementById('chat-menu-btn').style.display = 'inline-flex';
    document.getElementById('app-root').classList.add('chat-open');
    if (unsubMessages) unsubMessages();
    const msgRef = ref(db, 'channelMessages/' + id);
    unsubMessages = onValue(msgRef, (snap) => {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      if (!snap.exists()) { markChannelRead(id); return; }
      const msgs = Object.values(snap.val()).sort((a,b) => a.ts - b.ts);
      msgs.forEach(m => renderMessage(m, container, true));
      container.scrollTop = container.scrollHeight;
      markChannelRead(id);
    });
    renderChannels();
  };

  window.addMemberToChannel = async () => {
    const name = document.getElementById('new-member-name').value.trim();
    if (!name || !currentChannel) return;
    const uSnap = await get(ref(db, 'users/' + name));
    if (!uSnap.exists()) { toast('Пользователь не найден'); return; }
    await set(ref(db, 'channelMembers/' + currentChannel + '/' + name), { role: 'member', joined: Date.now() });
    await set(ref(db, 'userChannels/' + name + '/' + currentChannel), true);
    document.getElementById('new-member-name').value = '';
    closeModal('add-member-modal');
    toast(name + ' добавлен в канал');
  };

  window.toggleChatMenu = () => {
    if (currentChannel) openModal('add-member-modal');
  };

  window.openChat = (name) => {
    currentContact = name; currentChannel = null;
    document.getElementById('no-chat').style.display = 'none';
    document.getElementById('active-chat').style.display = 'flex';
    document.getElementById('chat-name').textContent = name;
    document.getElementById('chat-avatar').textContent = name[0].toUpperCase();
    document.getElementById('chat-avatar').style.background = getAvatarColor(name);
    document.getElementById('chat-status').textContent = 'онлайн';
    document.getElementById('chat-menu-btn').style.display = 'none';
    document.getElementById('app-root').classList.add('chat-open');
    if (unsubMessages) unsubMessages();
    const ck = chatKey(currentUser, name);
    const msgRef = ref(db, 'messages/' + ck);
    unsubMessages = onValue(msgRef, (snap) => {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      if (!snap.exists()) { markChatRead(name); return; }
      const msgs = Object.values(snap.val()).sort((a,b) => a.ts - b.ts);
      msgs.forEach(m => renderMessage(m, container, false));
      container.scrollTop = container.scrollHeight;
      markChatRead(name);
    });
    renderFriends();
  };

  window.closeChat = () => {
    currentContact = null; currentChannel = null;
    if (unsubMessages) { unsubMessages(); unsubMessages = null; }
    document.getElementById('no-chat').style.display = 'flex';
    document.getElementById('active-chat').style.display = 'none';
    document.getElementById('app-root').classList.remove('chat-open');
    renderFriends(); renderChannels();
  };

  function renderMessage(m, container, isChannel) {
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper';
    const isOwn = m.from === currentUser;
    if (isChannel && !isOwn) {
      const sender = document.createElement('div');
      sender.className = 'msg-sender';
      sender.textContent = m.from;
      wrapper.appendChild(sender);
    }
    const div = document.createElement('div');
    div.className = 'msg ' + (isOwn ? 'msg-own' : 'msg-other');
    const time = new Date(m.ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    let content = '';
    if (m.videoBase64) {
      content = `<video class="msg-video" src="${m.videoBase64}" loop autoplay muted playsinline onclick="this.paused?this.play():this.pause()"></video>`;
    } else {
      content = escapeHtml(m.text);
    }
    div.innerHTML = `<div>${content}</div><div class="msg-time">${time}</div>`;
    wrapper.appendChild(div);
    container.appendChild(wrapper);
  }

  async function markChatRead(name) {
    await set(ref(db, 'lastRead/' + currentUser + '/' + chatKey(currentUser, name)), Date.now());
  }
  async function markChannelRead(id) {
    await set(ref(db, 'lastRead/' + currentUser + '/channel_' + id), Date.now());
  }

  window.sendMessage = async () => {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    if (currentChannel) {
      const msgRef = push(ref(db, 'channelMessages/' + currentChannel));
      await set(msgRef, { from: currentUser, text, ts: Date.now() });
      await set(ref(db, 'channelMeta/' + currentChannel + '/lastActivity'), { ts: Date.now(), text, from: currentUser });
    } else if (currentContact) {
      const ck = chatKey(currentUser, currentContact);
      const msgRef = push(ref(db, 'messages/' + ck));
      await set(msgRef, { from: currentUser, to: currentContact, text, ts: Date.now() });
      await set(ref(db, 'chatMeta/' + ck + '/lastActivity'), { ts: Date.now(), text, from: currentUser });
    }
    input.value = ''; input.style.height = 'auto';
  };

  window.handleKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.sendMessage(); }
  };

  // ── Video / Кружочки через base64 (без Storage) ──
  window.uploadVideo = async () => {
    const fileInput = document.getElementById('video-input');
    const file = fileInput.files[0];
    if (!file) return;
    if (file.size > 900 * 1024) { toast('Видео слишком большое. Макс ~900 КБ (короткие кружки)'); return; }
    toast('Обработка видео...');
    try {
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result;
        if (base64.length > 900000) { toast('Видео слишком большое после конвертации'); return; }
        if (currentChannel) {
          const msgRef = push(ref(db, 'channelMessages/' + currentChannel));
          await set(msgRef, { from: currentUser, videoBase64: base64, ts: Date.now() });
          await set(ref(db, 'channelMeta/' + currentChannel + '/lastActivity'), { ts: Date.now(), videoUrl: true, from: currentUser });
        } else if (currentContact) {
          const ck = chatKey(currentUser, currentContact);
          const msgRef = push(ref(db, 'messages/' + ck));
          await set(msgRef, { from: currentUser, to: currentContact, videoBase64: base64, ts: Date.now() });
          await set(ref(db, 'chatMeta/' + ck + '/lastActivity'), { ts: Date.now(), videoUrl: true, from: currentUser });
        }
        toast('Кружок отправлен!');
      };
      reader.readAsDataURL(file);
    } catch (e) {
      toast('Ошибка: ' + e.message);
    }
    fileInput.value = '';
  };

  function escapeHtml(t) {
    const d = document.createElement('div'); d.textContent = t; return d.innerHTML;
  }

  const tx = document.getElementById('msg-input');
  tx.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });
</script>
</body>
</html>
