<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MiniChat v3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f5;
    display: flex; justify-content: center; align-items: center;
    min-height: 100dvh; padding: 0;
  }
  .app {
    width: 100%; max-width: 960px; height: 100dvh;
    background: #fff; border-radius: 0;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    display: flex; flex-direction: column; overflow: hidden;
    border: none;
  }
  @media (min-width: 769px) {
    .app { height: 640px; border-radius: 16px; border: 1px solid #e5e5e5; }
  }
  .header {
    padding: 12px 16px; border-bottom: 1px solid #eee;
    display: flex; align-items: center; justify-content: space-between;
    background: #fafafa; flex-shrink: 0;
  }
  .header-title { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .header-user { font-size: 14px; color: #666; display: flex; align-items: center; gap: 10px; }
  .btn {
    padding: 8px 14px; border-radius: 10px; border: 1px solid #ddd;
    background: #fff; color: #111; font-size: 14px; cursor: pointer;
    transition: all .15s; display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; flex-shrink: 0;
  }
  .btn:hover { background: #f0f0f0; }
  .btn-primary { background: #111; color: #fff; border-color: #111; }
  .btn-primary:hover { opacity: .9; background: #111; }
  .btn-icon { padding: 8px; width: 38px; height: 38px; }
  .btn-danger { background: #fff; color: #e11d48; border-color: #fecdd3; }
  .btn-danger:hover { background: #fff1f2; }
  .btn-success { background: #fff; color: #16a34a; border-color: #bbf7d0; }
  .btn-success:hover { background: #f0fdf4; }
  .screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }
  .form-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
  .form-box { width: 100%; max-width: 360px; }
  .form-title { font-size: 22px; font-weight: 600; margin-bottom: 24px; text-align: center; }
  .input-group { margin-bottom: 14px; }
  .input-group label { display: block; font-size: 14px; color: #666; margin-bottom: 4px; }
  .input-wrap { position: relative; display: flex; align-items: center; }
  .input-wrap input, .input-wrap textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #ddd; font-size: 15px; outline: none;
    transition: border-color .15s; background: #fff; font-family: inherit;
  }
  .input-wrap input:focus, .input-wrap textarea:focus { border-color: #111; }
  .toggle-pass {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 18px; color: #999;
    padding: 4px; line-height: 1;
  }
  .toggle-pass:hover { color: #111; }
  .form-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .form-actions .btn { justify-content: center; padding: 12px; font-size: 15px; }
  .form-toggle { text-align: center; font-size: 14px; color: #666; margin-top: 14px; }
  .form-toggle a { color: #111; cursor: pointer; text-decoration: underline; font-weight: 500; }
  .error-msg { color: #e11d48; font-size: 13px; margin-top: 4px; min-height: 18px; }
  .two-col { display: flex; flex: 1; overflow: hidden; position: relative; }
  .sidebar {
    width: 280px; border-right: 1px solid #eee;
    display: flex; flex-direction: column; background: #fafafa;
    flex-shrink: 0;
  }
  .sidebar-header { padding: 10px 14px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-title { font-size: 15px; font-weight: 600; }
  .sidebar-tabs { display: flex; border-bottom: 1px solid #eee; }
  .tab-btn {
    flex: 1; padding: 10px; border: none; background: transparent;
    font-size: 13px; font-weight: 500; color: #999; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all .15s;
    position: relative;
  }
  .tab-btn.active { color: #111; border-bottom-color: #111; }
  .tab-btn .badge {
    position: absolute; top: 4px; right: 4px;
    background: #e11d48; color: #fff; font-size: 10px;
    padding: 1px 5px; border-radius: 10px; font-weight: 600;
  }
  .add-contact-form { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #eee; }
  .add-contact-form input {
    flex: 1; padding: 8px 12px; border-radius: 8px;
    border: 1px solid #ddd; font-size: 14px; outline: none;
  }
  .add-contact-form input:focus { border-color: #111; }
  .hint { font-size: 12px; color: #999; padding: 6px 14px; }
  .contact-list { flex: 1; overflow-y: auto; padding: 6px; }
  .contact-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; border-radius: 10px; cursor: pointer;
    transition: background .15s; position: relative;
  }
  .contact-item:hover, .contact-item.active { background: #eee; }
  .contact-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-preview { font-size: 12px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-badge { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  .contact-actions {
    opacity: 0; transition: opacity .15s; display: flex; gap: 4px;
  }
  .contact-item:hover .contact-actions, .contact-item:focus-within .contact-actions { opacity: 1; }
  .main-chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .chat-header { padding: 10px 14px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.5; position: relative; word-break: break-word;
  }
  .msg-own { align-self: flex-end; background: #111; color: #fff; border-bottom-right-radius: 4px; }
  .msg-other { align-self: flex-start; background: #f0f0f0; color: #111; border-bottom-left-radius: 4px; }
  .msg-meta { font-size: 11px; opacity: .6; margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .msg-video {
    width: 200px; height: 200px; border-radius: 50%;
    object-fit: cover; display: block; background: #000;
  }
  .chat-input-area { padding: 10px 14px; border-top: 1px solid #eee; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
  .chat-input {
    flex: 1; padding: 10px 14px; border-radius: 12px;
    border: 1px solid #ddd; font-size: 15px; outline: none;
    resize: none; max-height: 100px; font-family: inherit; line-height: 1.4;
    min-height: 42px;
  }
  .chat-input:focus { border-color: #111; }
  .welcome-hint { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #bbb; font-size: 15px; text-align: center; padding: 40px; }
  .loader { display: inline-block; width: 16px; height: 16px; border: 2px solid #ddd; border-top-color: #111; border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 100; }
  .toast.show { opacity: 1; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center;
    z-index: 200; padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: 16px; padding: 24px;
    width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; justify-content: center; }

  /* Mobile */
  .mobile-back { display: none !important; }
  @media (max-width: 768px) {
    .sidebar { width: 100%; position: absolute; top: 0; left: 0; height: 100%; z-index: 1; }
    .main-chat { width: 100%; position: absolute; top: 0; left: 0; height: 100%; z-index: 2; background: #fff; display: none !important; }
    .app.chat-open .sidebar { display: none !important; }
    .app.chat-open .main-chat { display: flex !important; }
    .mobile-back { display: inline-flex !important; }
    .chat-input { font-size: 16px; }
    .input-wrap input { font-size: 16px; }
    .contact-actions { opacity: 1; }
    .sidebar { width: 100%; }
  }
</style>
<base target="_blank">
</head>
<body>

<div class="app" id="app-root">
  <!-- Auth -->
  <div class="screen active" id="screen-auth">
    <div class="header">
      <div class="header-title">💬 MiniChat</div>
    </div>
    <div class="form-container">
      <div class="form-box">
        <div class="form-title" id="auth-title">Вход</div>
        <div id="login-form">
          <div class="input-group">
            <label>Email</label>
            <div class="input-wrap">
              <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
            </div>
          </div>
          <div class="input-group">
            <label>Пароль</label>
            <div class="input-wrap">
              <input type="password" id="login-password" placeholder="••••••">
              <button type="button" class="toggle-pass" onclick="togglePassword('login-password')">👁</button>
            </div>
          </div>
          <div class="error-msg" id="login-error"></div>
          <div class="form-actions">
            <button class="btn btn-primary" onclick="doLogin()">Войти</button>
          </div>
          <div class="form-toggle">Нет аккаунта? <a onclick="showRegister()">Создать</a></div>
        </div>
        <div id="register-form" style="display:none">
          <div class="input-group">
            <label>Имя (ник)</label>
            <div class="input-wrap">
              <input type="text" id="reg-name" placeholder="your_nickname" autocomplete="off">
            </div>
          </div>
          <div class="input-group">
            <label>Email</label>
            <div class="input-wrap">
              <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
            </div>
          </div>
          <div class="input-group">
            <label>Пароль</label>
            <div class="input-wrap">
              <input type="password" id="reg-password" placeholder="минимум 6 символов">
              <button type="button" class="toggle-pass" onclick="togglePassword('reg-password')">👁</button>
            </div>
          </div>
          <div class="error-msg" id="reg-error"></div>
          <div class="form-actions">
            <button class="btn btn-primary" onclick="doRegister()">Создать аккаунт</button>
          </div>
          <div class="form-toggle">Уже есть аккаунт? <a onclick="showLogin()">Войти</a></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="screen" id="screen-main">
    <div class="header">
      <div class="header-title">💬 MiniChat</div>
      <div class="header-user">
        <span id="current-user-name"></span>
        <button class="btn btn-icon" onclick="logout()" title="Выйти">🚪</button>
      </div>
    </div>
    <div class="two-col">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-tabs">
          <button class="tab-btn active" id="tab-friends" onclick="switchTab('friends')">Друзья</button>
          <button class="tab-btn" id="tab-channels" onclick="switchTab('channels')">Каналы</button>
          <button class="tab-btn" id="tab-requests" onclick="switchTab('requests')">Заявки <span id="req-badge" class="badge" style="display:none">0</span></button>
        </div>

        <!-- Friends tab -->
        <div id="panel-friends">
          <div class="add-contact-form">
            <input type="text" id="add-contact-input" placeholder="Ник друга..." onkeydown="if(event.key==='Enter')sendFriendRequest()">
            <button class="btn btn-icon" onclick="sendFriendRequest()" title="Добавить">➕</button>
          </div>
          <div class="hint">Отправь заявку в друзья по нику</div>
          <div class="contact-list" id="contact-list"></div>
        </div>

        <!-- Channels tab -->
        <div id="panel-channels" style="display:none">
          <div class="add-contact-form">
            <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="openModal('create-channel-modal')">➕ Создать канал</button>
          </div>
          <div class="hint">Твои каналы и группы</div>
          <div class="contact-list" id="channel-list"></div>
        </div>

        <!-- Requests tab -->
        <div id="panel-requests" style="display:none">
          <div class="hint">Входящие заявки в друзья</div>
          <div class="contact-list" id="request-list"></div>
        </div>
      </div>

      <!-- Chat area -->
      <div class="main-chat" id="chat-panel">
        <div class="welcome-hint" id="no-chat">
          <div style="font-size:48px;opacity:.2">💬</div>
          Выбери друга или канал слева
        </div>
        <div id="active-chat" style="display:none;flex-direction:column;flex:1;overflow:hidden">
          <div class="chat-header">
            <button class="btn btn-icon mobile-back" onclick="closeChat()" title="Назад">←</button>
            <div class="contact-avatar" id="chat-avatar"></div>
            <div style="min-width:0;flex:1">
              <div class="contact-name" id="chat-name"></div>
              <div class="contact-preview" id="chat-status"></div>
            </div>
            <button class="btn btn-icon" id="chat-menu-btn" onclick="toggleChatMenu()" title="Меню">⋮</button>
          </div>
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-area">
            <input type="file" id="video-input" accept="video/*" style="display:none" onchange="uploadVideo()">
            <button class="btn btn-icon" onclick="document.getElementById('video-input').click()" title="Кружок">📹</button>
            <textarea class="chat-input" id="msg-input" rows="1" placeholder="Напиши сообщение..." onkeydown="handleKey(event)"></textarea>
            <button class="btn btn-primary" onclick="sendMessage()">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Create Channel Modal -->
<div class="modal-overlay" id="create-channel-modal">
  <div class="modal-box">
    <div class="modal-title">Создать канал</div>
    <div class="input-group">
      <label>Название</label>
      <div class="input-wrap">
        <input type="text" id="new-channel-name" placeholder="Мой канал" onkeydown="if(event.key==='Enter')createChannel()">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('create-channel-modal')">Отмена</button>
      <button class="btn btn-primary" onclick="createChannel()">Создать</button>
    </div>
  </div>
</div>

<!-- Add Member Modal -->
<div class="modal-overlay" id="add-member-modal">
  <div class="modal-box">
    <div class="modal-title">Добавить в канал</div>
    <div class="input-group">
      <label>Ник друга</label>
      <div class="input-wrap">
        <input type="text" id="new-member-name" placeholder="nickname" onkeydown="if(event.key==='Enter')addMemberToChannel()">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('add-member-modal')">Отмена</button>
      <button class="btn btn-primary" onclick="addMemberToChannel()">Добавить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, set, push, onValue, get, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB5aZcc6RtCZtIA4BHyUh6DA2HQ1n2gu-E",
    authDomain: "minichat-32a89.firebaseapp.com",
    databaseURL: "https://minichat-32a89-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "minichat-32a89",
    storageBucket: "minichat-32a89.firebasestorage.app",
    messagingSenderId: "273882434443",
    appId: "1:273882434443:web:cee3f9bdb215df7b54fd8e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const storage = getStorage(app);

  let currentUser = null;
  let currentContact = null;
  let currentChannel = null;
  let unsubMessages = null;
  let activeTab = 'friends';

  // ── UI helpers ──
  window.showLogin = () => {
    document.getElementById('login-form').style.display = 'block';
    document.getElementById('register-form').style.display = 'none';
    document.getElementById('auth-title').textContent = 'Вход';
    document.getElementById('login-error').textContent = '';
  };
  window.showRegister = () => {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('register-form').style.display = 'block';
    document.getElementById('auth-title').textContent = 'Регистрация';
    document.getElementById('reg-error').textContent = '';
  };
  window.togglePassword = (id) => {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  };
  window.openModal = (id) => document.getElementById(id).classList.add('show');
  window.closeModal = (id) => document.getElementById(id).classList.remove('show');

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── Auth ──
  window.doRegister = async () => {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-password').value;
    const errEl = document.getElementById('reg-error');
    if (!name || !email || !pass) { errEl.textContent = 'Заполни все поля'; return; }
    if (pass.length < 6) { errEl.textContent = 'Пароль минимум 6 символов'; return; }
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      await set(ref(db, 'uids/' + cred.user.uid), name);
      await set(ref(db, 'users/' + name), { uid: cred.user.uid, email, created: Date.now() });
      errEl.textContent = '';
      toast('Аккаунт создан!');
      window.showLogin();
      document.getElementById('login-error').textContent = 'Теперь войди.';
    } catch (e) {
      errEl.textContent = e.message.includes('email-already') ? 'Этот email уже используется' : e.message;
    }
  };

  window.doLogin = async () => {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      errEl.textContent = '';
    } catch (e) {
      errEl.textContent = 'Неверный email или пароль';
    }
  };

  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const uidSnap = await get(ref(db, 'uids/' + user.uid));
      currentUser = uidSnap.exists() ? uidSnap.val() : (user.displayName || user.email.split('@')[0]);
      document.getElementById('screen-auth').classList.remove('active');
      document.getElementById('screen-main').classList.add('active');
      document.getElementById('current-user-name').textContent = currentUser;
      listenRequests();
      renderFriends();
      renderChannels();
    } else {
      currentUser = null; currentContact = null; currentChannel = null;
      if (unsubMessages) { unsubMessages(); unsubMessages = null; }
      document.getElementById('screen-auth').classList.add('active');
      document.getElementById('screen-main').classList.remove('active');
      document.getElementById('no-chat').style.display = 'flex';
      document.getElementById('active-chat').style.display = 'none';
      document.getElementById('app-root').classList.remove('chat-open');
    }
  });

  // ── Tabs ──
  window.switchTab = (tab) => {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('panel-friends').style.display = tab === 'friends' ? 'block' : 'none';
    document.getElementById('panel-channels').style.display = tab === 'channels' ? 'block' : 'none';
    document.getElementById('panel-requests').style.display = tab === 'requests' ? 'block' : 'none';
    if (tab === 'friends') renderFriends();
    if (tab === 'channels') renderChannels();
    if (tab === 'requests') renderRequests();
  };

  // ── Friend requests ──
  window.sendFriendRequest = async () => {
    const input = document.getElementById('add-contact-input');
    const to = input.value.trim();
    if (!to) return;
    if (to === currentUser) { toast('Это ты :)'); input.value = ''; return; }
    const uSnap = await get(ref(db, 'users/' + to));
    if (!uSnap.exists()) { toast('Пользователь "' + to + '" не найден'); return; }
    // Check if already friends
    const cSnap = await get(ref(db, 'contacts/' + currentUser + '/' + to));
    if (cSnap.exists()) { toast('Уже в друзьях'); input.value = ''; return; }
    // Check if already sent
    const rSnap = await get(ref(db, 'friendRequests/' + to + '/' + currentUser));
    if (rSnap.exists()) { toast('Заявка уже отправлена'); input.value = ''; return; }
    await set(ref(db, 'friendRequests/' + to + '/' + currentUser), { from: currentUser, ts: Date.now() });
    input.value = '';
    toast('Заявка отправлена!');
  };

  function listenRequests() {
    onValue(ref(db, 'friendRequests/' + currentUser), (snap) => {
      const count = snap.exists() ? Object.keys(snap.val()).length : 0;
      const badge = document.getElementById('req-badge');
      badge.textContent = count;
      badge.style.display = count > 0 ? 'inline-block' : 'none';
      if (activeTab === 'requests') renderRequests();
    });
  }

  async function renderRequests() {
    const list = document.getElementById('request-list');
    const snap = await get(ref(db, 'friendRequests/' + currentUser));
    if (!snap.exists()) { list.innerHTML = '<div class="hint" style="text-align:center;padding-top:20px">Нет входящих заявок</div>'; return; }
    list.innerHTML = '';
    Object.entries(snap.val()).forEach(([from, data]) => {
      const div = document.createElement('div');
      div.className = 'contact-item';
      div.innerHTML = `
        <div class="contact-avatar">${from[0].toUpperCase()}</div>
        <div class="contact-info"><div class="contact-name">${escapeHtml(from)}</div><div class="contact-preview">Хочет добавить тебя</div></div>
        <div class="contact-actions">
          <button class="btn btn-success btn-icon" onclick="acceptRequest('${from}')">✓</button>
          <button class="btn btn-danger btn-icon" onclick="rejectRequest('${from}')">✕</button>
        </div>`;
      list.appendChild(div);
    });
  }

  window.acceptRequest = async (from) => {
    await set(ref(db, 'contacts/' + currentUser + '/' + from), true);
    await set(ref(db, 'contacts/' + from + '/' + currentUser), true);
    await remove(ref(db, 'friendRequests/' + currentUser + '/' + from));
    toast(from + ' добавлен в друзья');
    renderRequests(); renderFriends();
  };

  window.rejectRequest = async (from) => {
    await remove(ref(db, 'friendRequests/' + currentUser + '/' + from));
    toast('Заявка отклонена');
    renderRequests();
  };

  // ── Friends ──
  async function renderFriends() {
    const list = document.getElementById('contact-list');
    list.innerHTML = '<div class="hint" style="text-align:center;padding:20px"><span class="loader"></span></div>';
    const snap = await get(ref(db, 'contacts/' + currentUser));
    const contacts = snap.exists() ? snap.val() : {};
    list.innerHTML = '';
    const names = Object.keys(contacts).sort();
    if (names.length === 0) {
      list.innerHTML = '<div class="hint" style="text-align:center;padding-top:20px">Пока нет друзей.<br>Отправь заявку!</div>';
      return;
    }
    for (const name of names) {
      const msgSnap = await get(ref(db, 'messages/' + chatKey(currentUser, name)));
      const msgs = msgSnap.exists() ? Object.values(msgSnap.val()) : [];
      const last = msgs.length ? msgs[msgs.length - 1] : null;
      const div = document.createElement('div');
      div.className = 'contact-item' + (currentContact === name && !currentChannel ? ' active' : '');
      div.onclick = () => openChat(name);
      div.innerHTML = `
        <div class="contact-avatar">${name[0].toUpperCase()}</div>
        <div class="contact-info">
          <div class="contact-name">${escapeHtml(name)}</div>
          <div class="contact-preview">${last ? (last.videoUrl ? '📹 Кружок' : escapeHtml(last.text.substring(0,30))) : 'Нет сообщений'}</div>
        </div>
        <div class="contact-actions">
          <button class="btn btn-danger btn-icon" onclick="event.stopPropagation();removeFriend('${name}')">🗑</button>
        </div>`;
      list.appendChild(div);
    }
  }

  window.removeFriend = async (name) => {
    if (!confirm('Удалить ' + name + ' из друзей?')) return;
    await remove(ref(db, 'contacts/' + currentUser + '/' + name));
    await remove(ref(db, 'contacts/' + name + '/' + currentUser));
    if (currentContact === name) closeChat();
    toast(name + ' удалён из друзей');
    renderFriends();
  };

  function chatKey(a, b) { return [a, b].sort().join('__'); }

  // ── Channels ──
  window.createChannel = async () => {
    const name = document.getElementById('new-channel-name').value.trim();
    if (!name) return;
    const chRef = push(ref(db, 'channels'));
    await set(chRef, { name, createdBy: currentUser, created: Date.now() });
    await set(ref(db, 'channelMembers/' + chRef.key + '/' + currentUser), { role: 'admin', joined: Date.now() });
    await set(ref(db, 'userChannels/' + currentUser + '/' + chRef.key), true);
    document.getElementById('new-channel-name').value = '';
    closeModal('create-channel-modal');
    toast('Канал создан!');
    renderChannels();
  };

  async function renderChannels() {
    const list = document.getElementById('channel-list');
    list.innerHTML = '<div class="hint" style="text-align:center;padding:20px"><span class="loader"></span></div>';
    const snap = await get(ref(db, 'userChannels/' + currentUser));
    if (!snap.exists()) { list.innerHTML = '<div class="hint" style="text-align:center;padding-top:20px">Нет каналов.<br>Создай первый!</div>'; return; }
    list.innerHTML = '';
    const ids = Object.keys(snap.val());
    for (const id of ids) {
      const chSnap = await get(ref(db, 'channels/' + id));
      if (!chSnap.exists()) continue;
      const ch = chSnap.val();
      const msgSnap = await get(ref(db, 'channelMessages/' + id));
      const msgs = msgSnap.exists() ? Object.values(msgSnap.val()) : [];
      const last = msgs.length ? msgs[msgs.length - 1] : null;
      const div = document.createElement('div');
      div.className = 'contact-item' + (currentChannel === id ? ' active' : '');
      div.onclick = () => openChannel(id);
      div.innerHTML = `
        <div class="contact-avatar" style="background:#4f46e5">#</div>
        <div class="contact-info">
          <div class="contact-name">${escapeHtml(ch.name)}</div>
          <div class="contact-preview">${last ? (last.videoUrl ? '📹 Кружок' : escapeHtml(last.text.substring(0,30))) : 'Нет сообщений'}</div>
        </div>`;
      list.appendChild(div);
    }
  }

  window.openChannel = async (id) => {
    currentChannel = id; currentContact = null;
    const chSnap = await get(ref(db, 'channels/' + id));
    const ch = chSnap.val() || {};
    document.getElementById('no-chat').style.display = 'none';
    document.getElementById('active-chat').style.display = 'flex';
    document.getElementById('chat-name').textContent = ch.name || 'Канал';
    document.getElementById('chat-avatar').textContent = '#';
    document.getElementById('chat-avatar').style.background = '#4f46e5';
    document.getElementById('chat-status').textContent = 'канал';
    document.getElementById('chat-menu-btn').style.display = 'inline-flex';
    document.getElementById('app-root').classList.add('chat-open');
    if (unsubMessages) unsubMessages();
    const msgRef = ref(db, 'channelMessages/' + id);
    unsubMessages = onValue(msgRef, (snap) => {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      if (!snap.exists()) return;
      const msgs = Object.values(snap.val()).sort((a,b) => a.ts - b.ts);
      msgs.forEach(m => renderMessage(m, container));
      container.scrollTop = container.scrollHeight;
    });
    renderChannels();
  };

  window.addMemberToChannel = async () => {
    const name = document.getElementById('new-member-name').value.trim();
    if (!name || !currentChannel) return;
    const uSnap = await get(ref(db, 'users/' + name));
    if (!uSnap.exists()) { toast('Пользователь не найден'); return; }
    await set(ref(db, 'channelMembers/' + currentChannel + '/' + name), { role: 'member', joined: Date.now() });
    await set(ref(db, 'userChannels/' + name + '/' + currentChannel), true);
    document.getElementById('new-member-name').value = '';
    closeModal('add-member-modal');
    toast(name + ' добавлен в канал');
  };

  window.toggleChatMenu = () => {
    if (currentChannel) {
      openModal('add-member-modal');
    }
  };

  // ── Chat (private) ──
  window.openChat = (name) => {
    currentContact = name; currentChannel = null;
    document.getElementById('no-chat').style.display = 'none';
    document.getElementById('active-chat').style.display = 'flex';
    document.getElementById('chat-name').textContent = name;
    document.getElementById('chat-avatar').textContent = name[0].toUpperCase();
    document.getElementById('chat-avatar').style.background = '#111';
    document.getElementById('chat-status').textContent = 'онлайн';
    document.getElementById('chat-menu-btn').style.display = 'none';
    document.getElementById('app-root').classList.add('chat-open');
    if (unsubMessages) unsubMessages();
    const msgRef = ref(db, 'messages/' + chatKey(currentUser, name));
    unsubMessages = onValue(msgRef, (snap) => {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      if (!snap.exists()) return;
      const msgs = Object.values(snap.val()).sort((a,b) => a.ts - b.ts);
      msgs.forEach(m => renderMessage(m, container));
      container.scrollTop = container.scrollHeight;
    });
    renderFriends();
  };

  window.closeChat = () => {
    currentContact = null; currentChannel = null;
    if (unsubMessages) { unsubMessages(); unsubMessages = null; }
    document.getElementById('no-chat').style.display = 'flex';
    document.getElementById('active-chat').style.display = 'none';
    document.getElementById('app-root').classList.remove('chat-open');
    renderFriends(); renderChannels();
  };

  function renderMessage(m, container) {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.from === currentUser ? 'msg-own' : 'msg-other');
    const time = new Date(m.ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    let content = '';
    if (m.videoUrl) {
      content = `<video class="msg-video" src="${escapeHtml(m.videoUrl)}" loop autoplay muted playsinline></video>`;
    } else {
      content = escapeHtml(m.text);
    }
    div.innerHTML = `<div>${content}</div><div class="msg-meta"><span>${escapeHtml(m.from)}</span><span>${time}</span></div>`;
    container.appendChild(div);
  }

  // ── Send text ──
  window.sendMessage = async () => {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    if (currentChannel) {
      await push(ref(db, 'channelMessages/' + currentChannel), { from: currentUser, text, ts: Date.now() });
    } else if (currentContact) {
      await push(ref(db, 'messages/' + chatKey(currentUser, currentContact)), { from: currentUser, to: currentContact, text, ts: Date.now() });
    }
    input.value = ''; input.style.height = 'auto';
  };

  window.handleKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.sendMessage(); }
  };

  // ── Video / Кружочки ──
  window.uploadVideo = async () => {
    const fileInput = document.getElementById('video-input');
    const file = fileInput.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { toast('Файл слишком большой (макс 10 МБ)'); return; }
    toast('Загрузка видео...');
    try {
      const path = 'videos/' + Date.now() + '_' + file.name;
      const sRef = storageRef(storage, path);
      await uploadBytes(sRef, file);
      const url = await getDownloadURL(sRef);
      if (currentChannel) {
        await push(ref(db, 'channelMessages/' + currentChannel), { from: currentUser, videoUrl: url, ts: Date.now() });
      } else if (currentContact) {
        await push(ref(db, 'messages/' + chatKey(currentUser, currentContact)), { from: currentUser, to: currentContact, videoUrl: url, ts: Date.now() });
      }
      toast('Кружок отправлен!');
    } catch (e) {
      toast('Ошибка загрузки: ' + e.message);
    }
    fileInput.value = '';
  };

  function escapeHtml(t) {
    const d = document.createElement('div'); d.textContent = t; return d.innerHTML;
  }

  // Auto-resize textarea
  const tx = document.getElementById('msg-input');
  tx.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 100) + 'px'; });
</script>
</body>
</html>
